[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollama-workspace"
version = "0.1.0"
description = "Terminal chat for any Ollama model, with per-project memory and code-editing tools."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.6",
    "prompt_toolkit>=3.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "ddgs>=9.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ochat = "ollama_workspace.chat:main"

[tool.hatch.build.targets.wheel]
packages = ["ollama_workspace"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollama-workspace"
version = "0.1.0"
description = "Terminal chat for any Ollama model, with per-project memory and code-editing tools."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.6",
    "prompt_toolkit>=3.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "ddgs>=9.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ochat = "ollama_workspace.chat:main"

[tool.hatch.build.targets.wheel]
packages = ["ollama_workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pyflakes + basic pycodestyle error classes only (this ruff version's own default pulls in
# far more, e.g. bandit/pylint-style rules, which would mean rewriting a lot of working code
# just to satisfy a lint pass - this is meant to catch real bugs, not restyle the project).
select = ["E4", "E7", "E9", "F"]
